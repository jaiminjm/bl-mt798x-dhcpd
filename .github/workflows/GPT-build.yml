name: GPT Build

on:
  workflow_dispatch:
    inputs:
      TARGET_MODEL:
        description: '目标机型 JSON 文件名 (不带.json后缀)'
        required: true
        default: 'cmcc_rax3000m-emmc'
        type: string
      PROD_SIZE:
        description: 'production 分区大小'
        required: true
        default: '8G'
        type: string

jobs:
  build-gpt:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout source
        run: |
          git clone https://github.com/Yuzhii0718/bl-mt798x-dhcpd.git
          cd bl-mt798x-dhcpd

      - name: Prepare build environment
        run: |
          cd bl-mt798x-dhcpd
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 python3-pip

           - name: Modify JSON configuration
        run: |
          cd bl-mt798x-dhcpd
          TARGET_JSON="mt798x_gpt/${{ github.event.inputs.TARGET_MODEL }}.json"
          echo "Checking $TARGET_JSON"
          python3 - << 'EOF'
          import json
          import os
          import sys
          
          target_json = os.environ.get('TARGET_JSON')
          if not target_json:
              target_json = "mt798x_gpt/cmcc_rax3000m-emmc.json"
          
          prod_size = os.environ.get('PROD_SIZE')
          if not prod_size:
              prod_size = "8G"
          
          try:
              with open(target_json, 'r') as f:
                  data = json.load(f)
              
              for part in data.get('partitions', []):
                  if part.get('name') == 'production':
                      part['size'] = prod_size
                  if part.get('name') == 'ubootenv':
                      part['name'] = 'u-boot-env'
                      
              with open(target_json, 'w') as f:
                  json.dump(data, f, indent=4)
              print("JSON modified successfully!")
          except Exception as e:
              print(f"Error: {e}")
              sys.exit(1)
          EOF
"

      - name: Build GPT
        run: |
          cd bl-mt798x-dhcpd
          echo "# CONFIG_BUILD_FIP is not set" > .config
          echo "# CONFIG_BUILD_ATF is not set" >> .config
          echo "CONFIG_BUILD_GPT=y" >> .config
          make defconfig
          make build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: custom-8g-gpt
          path: bl-mt798x-dhcpd/output_gpt/*.bin
