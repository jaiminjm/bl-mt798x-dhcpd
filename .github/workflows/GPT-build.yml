name: GPT Build

on:
  workflow_dispatch:
    inputs:
      TARGET_MODEL:
        description: '目标机型 JSON 文件名 (不带.json后缀)'
        required: true
        default: 'cmcc_rax3000m-emmc'
        type: string
      PROD_SIZE:
        description: 'production 分区大小'
        required: true
        default: '8G'
        type: string

jobs:
  build-gpt:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout source
        run: |
          git clone https://github.com/Yuzhii0718/bl-mt798x-dhcpd.git

      - name: Prepare build environment
        run: |
          sudo apt-get update -qq
          # 这里补上了 python2，因为底层的 generate_gpt.sh 依赖它
          sudo apt-get install -y -qq jq make gcc python2

      - name: Modify JSON configuration
        run: |
          cd bl-mt798x-dhcpd
          TARGET_JSON="mt798x_gpt/${{ github.event.inputs.TARGET_MODEL }}.json"
          PROD_SIZE="${{ github.event.inputs.PROD_SIZE }}"
          echo "Checking $TARGET_JSON"
          
          jq --arg size "$PROD_SIZE" '
            .partitions |= map(
              if .name == "production" then .size = $size
              elif .name == "ubootenv" then .name = "u-boot-env"
              else . end
            )
          ' "$TARGET_JSON" > temp.json && mv temp.json "$TARGET_JSON"
          
          echo "JSON modified successfully!"

      - name: Build GPT
        run: |
          cd bl-mt798x-dhcpd
          echo "# CONFIG_BUILD_FIP is not set" > .config
          echo "# CONFIG_BUILD_ATF is not set" >> .config
          echo "CONFIG_BUILD_GPT=y" >> .config
          make defconfig
          make build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: custom-8g-gpt
          path: bl-mt798x-dhcpd/output_gpt/*.bin
